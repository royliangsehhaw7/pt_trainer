{% extends "trainer/base.html" %}

{% block content %}
<div class="container-fluid d-flex justify-content-center align-items-center px-1 px-md-5" style="min-height: 60vh;">

    <div class="card shadow border-0 w-100" style="max-width: 500px;">
        <div class="card-body p-3 p-md-4"> <h3 class="text-center fw-bold mb-4">Create Account</h3>

            <form method="post">
                {% csrf_token %}

                <div class="row g-2 mb-3">
                    <div class="col-12 col-md-6">
                        <div class="input-group">
                            <span class="input-group-text text-muted border-end-0">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" name="first_name" class="form-control form-control-lg border-start-0" placeholder="First Name" required>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="input-group">
                            <span class="input-group-text text-muted border-end-0">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" name="last_name" class="form-control form-control-lg border-start-0" placeholder="Last Name" required>
                        </div>
                    </div>
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text text-muted border-end-0">
                        <i class="bi bi-envelope-at"></i>
                    </span>
                    <input type="email" name="email" class="form-control form-control-lg border-start-0" placeholder="Email Address" required>
                </div>

                <div class="input-group mb-4">
                    <span class="input-group-text text-muted border-end-0">
                        <i class="bi bi-shield-lock"></i>
                    </span>
                    <input type="password" name="password" class="form-control form-control-lg border-start-0" placeholder="Create Password" required>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm">
                    Create Account
                </button>

                <div class="text-center mt-4">
                    <span class="small text-muted">Already have an account? </span>
                    <a href="{% url 'login' %}" class="small text-decoration-none fw-bold">Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
