{% extends "trainer/base.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">

    <div class="card shadow border-0" style="width: 100%; max-width: 450px;">
        <div class="card-body p-4">

            <h3 class="text-center fw-bold mb-4">Login</h3>

            {% if form.errors %}
                <div class="alert alert-danger py-2 small text-center">
                    Invalid username or password.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="input-group mb-3">
                    <span class="input-group-text text-muted border-end-0">
                        <i class="bi bi-person-fill"></i>
                    </span>
                    <input type="text" 
                           name="username" 
                           class="form-control form-control-lg border-start-0" 
                           placeholder="Username or Email" 
                           required>
                </div>

                <div class="input-group mb-4">
                    <span class="input-group-text text-muted border-end-0">
                        <i class="bi bi-lock-fill"></i>
                    </span>
                    <input type="password" 
                           name="password" 
                           class="form-control form-control-lg border-start-0" 
                           placeholder="Password" 
                           required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                    Login
                </button>

            </form>

            <div class="text-center mt-4">
                <a href="{% url 'password_reset' %}" class="small text-decoration-none d-block mb-2 text-muted">
                    Forgot password?
                </a>

                <span class="small text-muted">New here? </span>
                <a href="{% url 'register' %}" class="small text-decoration-none fw-bold">
                    Create an account
                </a>
            </div>

        </div>
    </div>

</div>
{% endblock %}
