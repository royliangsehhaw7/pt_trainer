{% extends 'trainer/base.html' %}

{% block content %}
<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-md-10"> 
            <div class="card shadow-sm">
                <div class="card-body p-2"> <div id="calendar"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

<link href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css' rel='stylesheet'>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    
    var calendar = new FullCalendar.Calendar(calendarEl, {
      // FIX 1: Use dayGridWeek instead of timeGridWeek
      initialView: 'dayGridMonth',
      
      aspectRatio: 2, 
      displayEventTime: false, 
      height: 'auto',

      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        // FIX 2: Swap timeGridWeek for dayGridWeek here too
        right: 'dayGridMonth,dayGridWeek' 
      },

      events: '{% url "calendar_json" %}', 
      themeSystem: 'bootstrap5',
      
      dateClick: function(info) {
        window.location.href = "{% url 'appointment_add' %}?date=" + info.dateStr;
      },
      
      eventClick: function(info) {
        if (info.event.url) {
          info.jsEvent.preventDefault();
          window.location.href = info.event.url;
        }
      }
    });

    calendar.render();
});

</script>
{% endblock %}
