{% extends 'trainer/base.html' %}

{% block custom_styles %}
    {% load static %}
    <link href="{% static 'css/appointment.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
    <div>
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
            <h3 class="mb-2 mb-sm-0">delete appointment</h3>
            <!-- You can put a back button if needed -->
            <a href="{% url 'appointment_list' %}" class="btn btn-outline-secondary">Back</a>
        </div>

        <hr class="opacity-100" style="height:5px; background-color: #3ABEF9;" />

        <div class="card shadow-sm border-danger p-4 mt-4">
            <h5>Are you sure you want to delete the appointment <strong>"{{ exercise.client.name }}"</strong>?</h5>
            
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Confirm Delete</button>
                    <a href="{% url 'appointment_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
