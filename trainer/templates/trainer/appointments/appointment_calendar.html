{% extends 'trainer/base.html' %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
        <div>
            <h3 class="mb-0">appointments</h3>            
        </div>
        <div>
            <a href="{% url 'appointment_calendar' %}">
                <button type="button" class="btn btn-secondary">calendar</button>
            </a>
            <a href="{% url 'appointment_list' %}">
                <button type="button" class="btn btn-secondary">list</button>
            </a>
        </div>
    </div>

    <hr class="opacity-100" style="height:2px; background-color: #F971B0;" />

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
        <!-- Search Aligned Far Left -->
        <form method="GET" action="{% url 'client_list' %}" class="flex-grow-1 flex-sm-grow-0" style="min-width: 300px;">
            <div class="input-group">
                <input type="text" name="search" value="{{search}}" class="form-control" placeholder="Search by name...">
                <button type="submit" class="btn btn-outline-secondary">GO</button>
            </div>
        </form>

        <span class="text-small text-muted">select a date to create an appointment</span>
    </div>

    <!-- container for fullcalendar6 component -->
    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-12"> 
                    <div class="pt-2"> 
                        <div id="calendar"></div>
                    </div>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // get div element from DOM
            var calendarEl = document.getElementById('calendar');
            
            // calender configurations
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',            
                aspectRatio: 2, 
                displayEventTime: false, 
                height: 'auto',

                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,dayGridWeek' 
                },
                themeSystem: 'bootstrap5',

            
                // calendar events
                // events: '{% url "calendar_json" %}',    // this is from the appointment_view.py
                events: function(fetchInfo, successCallback, failureCallback) {
                    fetch('/calendar_json')
                        .then(res => res.json())
                        .then(data => successCallback(data));
                },               

                // this is double click on any dates
                dateClick: function(info) {
                    debugger;
                    window.location.href = "{% url 'appointment_add' %}?date=" + info.dateStr;
                },
                // this is click on any appointment/event
                eventClick: function(info) {
                    debugger;
                    if (info.event.url) {
                        info.jsEvent.preventDefault();
                        // url will be /appointment/edit/{info.id}
                        window.location.href = info.event.url;
                    }
                }
            });

            calendar.render();
        });
  </script>
{% endblock %}
