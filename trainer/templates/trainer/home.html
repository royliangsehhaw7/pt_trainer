{% extends "trainer/base.html" %}

{% block content %}
<div class="py-4">
    <h3 class="mb-4 text-center">Trainer Dashboard</h3>

    <!-- First Row: 3 Cards (Stacks on mobile, 3-wide on medium screens+) -->
    <div class="row row-cols-1 row-cols-md-3 g-4 mb-4">
        <div class="col">
            <div class="card h-100 bg-dark shadow-sm">
                <div class="card-body">
                    <h6 class="card-title text-success mb-3">Clients</h6>

                    <div class="row align-items-center">
                        
                        <!-- LEFT: Big number -->
                        <div class="col-6 text-center border-end">
                            <div class="display-2 text-white">12</div>
                            <small class="text-body-secondary">Clients</small>
                        </div>

                        <!-- right vertical stack -->
                        <div class="col-6">
                            <div class="d-flex justify-content-between">
                                <span class="text-body-secondary">Active</span>
                                <span class="fw-bold text-success">3</span>
                            </div>

                            <div class="d-flex justify-content-between">
                                <span class="text-body-secondary">Registered</span>
                                <span class="fw-bold text-info">5</span>
                            </div>

                            <div class="d-flex justify-content-between">
                                <span class="text-body-secondary">Retired</span>
                                <span class="fw-bold text-secondary">4</span>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>    
        <div class="col">
            <div class="card h-100 bg-dark shadow-sm">
                <div class="card-body">
                    <!-- <h6 class="card-title text-success mb-3">Metrics</h6> -->

                    <div class="row text-center">
                        <!-- Metric 1 -->
                        <div class="col-6">
                            <h1 class="display-3 text-white mb-0">5</h1>
                            <small class="text-body-secondary">Tags</small>
                        </div>

                        <!-- Metric 2 -->
                        <div class="col-6">
                            <h1 class="display-3 text-white mb-0">22</h1>
                            <small class="text-body-secondary">Exercises</small>
                        </div>
                    </div>

                    <div class="mt-3 text-center">
                        <a href="#" class="btn btn-sm btn-outline-success">View Details</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card h-100 bg-dark shadow-sm">
                <div class="card-body">
                    <h6 class="card-title text-success mb-3 text-end">Programs</h6>

                    <div class="row align-items-center">
                        <!-- RIGHT: Vertical stack -->
                        <div class="col-6  border-end">
                            <div class="d-flex justify-content-between">
                                <span class="text-body-secondary">Not Started</span>
                                <span class="fw-bold text-success">3</span>
                            </div>

                            <div class="d-flex justify-content-between">
                                <span class="text-body-secondary">In Progress</span>
                                <span class="fw-bold text-info">5</span>
                            </div>

                            <div class="d-flex justify-content-between">
                                <span class="text-body-secondary">Completed</span>
                                <span class="fw-bold text-secondary">4</span>
                            </div>
                        </div>
                        
                        <!-- LEFT: Big number -->
                        <div class="col-6 text-center">
                            <div class="display-2 text-white">12</div>
                            <small class="text-body-secondary">Clients</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>    

    </div>

    <!-- Second Row: 2 Cards (Stacks on mobile, 2-wide on medium screens+) -->
    <div class="row row-cols-1 row-cols-md-2 g-4">
        <div class="col">
            <div class="card h-100 bg-dark shadow-sm">
                <div class="card-body">
                    <h5 class="card-title text-success">Upcoming Appointments</h5>
            <div class="card h-100 bg-dark shadow-sm">
                <div class="card-body" id="calendar">
                </div>
            </div>
                </div>
            </div>
        </div>
        <div class="col">
        </div>
    </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    
    var calendar = new FullCalendar.Calendar(calendarEl, {
      // FIX 1: Use dayGridWeek instead of timeGridWeek
      initialView: 'listMonth',
      
    //   aspectRatio: 2, 
      displayEventTime: false, 
      height: 'auto',

      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        // FIX 2: Swap timeGridWeek for dayGridWeek here too
        right: 'listMonth' 
      },

      events: '{% url "calendar_json" %}', 
      themeSystem: 'bootstrap5',
      
      dateClick: function(info) {
        window.location.href = "{% url 'appointment_add' %}?date=" + info.dateStr;
      },
      
    //   eventClick: function(info) {
    //     if (info.event.url) {
    //       info.jsEvent.preventDefault();
    //       window.location.href = info.event.url;
    //     }
    //   }
    });

    calendar.render();
});

</script>
{% endblock %}
