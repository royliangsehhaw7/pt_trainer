{% extends 'trainer/base.html' %}

{% block content %}
    <!-- row 1: page title -->
    <div class="row mb-3">
        <div class="col-12">
            <h3 class="mb-0">clients</h3>
        </div>
    </div>

    <hr class="opacity-100" style="height:2px; background-color: #F971B0;" />

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
        <!-- Search Aligned Far Left -->
        <form method="GET" action="{% url 'client_list' %}" class="flex-grow-1 flex-sm-grow-0" style="min-width: 300px;">
            <div class="input-group">
                <input type="text" name="search" value="{{search}}" class="form-control" placeholder="Search by name...">
                <button type="submit" class="btn btn-outline-secondary">GO</button>
            </div>
        </form>

        <a href="{% url 'client_add' %}" class="btn px-4" style="background-color: #F971B0">
            add
        </a>
    </div>

    <!-- row 3: main tags list -->
    <div class="table-responsive mt-4">
        <table class="table table-hover shadow-sm align-middle">
            <thead class="table-dark">
                <tr>
                    <th>name</th>
                    <th>email</th>
                    <th>workouts</th>
                    <th class="text-end">actions</th>
                </tr>
            </thead>
            <tbody>
                {% for client in clients %}
                <tr>
                    <td class="text-break">{{ client.name }}</td>
                    <td class="text-break">{{ client.email }}</td>
                    <td class="text-break"></td>
                    <td class="text-end">
                        <div class="btn-group flex-column flex-sm-row">
                            <a href="{% url 'client_edit' client.id %}" class="btn btn-sm btn-outline-primary mb-1 mb-sm-0">Edit</a>
                            <a href="{% url 'client_delete' client.id %}" class="btn btn-sm btn-outline-danger">Delete</a>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">No clients</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- bootstrap 5 pagination -->
    {% include 'trainer/includes/_pagination.html' %}  
   
{% endblock %}
