{% extends 'trainer/base.html' %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
        <h4 class="mb-2 mb-sm-0">Clients</h4>
        <a href="{% url 'client_add' %}" class="btn btn-primary">+ Add Client</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover border shadow-sm align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for client in clients %}
                <tr>
                    <td class="fw-bold">{{ client.name }}</td>
                    <td class="fw-bold">{{ client.email }}</td>
                    <td class="text-end">
                        <div class="btn-group flex-column flex-sm-row">
                            <a href="{% url 'client_edit' client.id %}" class="btn btn-sm btn-outline-primary mb-1 mb-sm-0">Edit</a>
                            <a href="{% url 'client_delete' client.id %}" class="btn btn-sm btn-outline-danger">Delete</a>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">No clients</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
