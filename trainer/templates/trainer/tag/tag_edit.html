{% extends "trainer/base.html" %}


{% block content %}
<div class="px-2">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
        <h3 class="mb-2 mb-sm-0">edit tags</h3>
        <!-- You can put a back button if needed -->
        <a href="{% url 'tag_list' %}" class="btn btn-outline-secondary">Back</a>
    </div>

    <hr class="opacity-100" style="height:5px; background-color: #3ABEF9;" />

    <form method="POST">
        {% csrf_token %}

        <!-- tag Name -->
        <div class="border rounded p-4 mt-4">
            <div class="mb-3 row">
                <label class="col-12 col-md-2 col-form-label">{{ form.name.label }}</label>
                <div class="col">
                    {{ form.name }}

                    {% for error in form.name.errors %}
                        <div class="text-danger small">{{ error }}</div>
                    {% endfor %}
                </div>
            </div>
        </div>

        <!-- buttons actions -->      
        <div class="mt-4 d-flex gap-2 justify-content-end">
            <a href="{% url 'tag_list' %}" class="btn btn-outline-secondary w-100 w-sm-auto">
                Cancel
            </a>
            <button type="submit" class="btn btn-primary w-100 w-sm-auto">Save</button>
        </div>
    </form>
</div>
{% endblock %}
