{% extends "trainer/base.html" %}


{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
    <h2 class="mb-2 mb-sm-0">TAGS</h2>
    <!-- You can put a back button if needed -->
    <a href="{% url 'tag_list' %}" class="btn btn-outline-secondary">Back</a>
</div>

<form method="POST" class="border rounded p-4 shadow-sm bg-body">
    {% csrf_token %}

    <!-- Tag Name -->
    <div class="mb-3 row">
        <label class="col-sm-2 col-form-label">{{ form.name.label }}</label>
        <div class="col-sm-10">
            {{ form.name }}

            {% for error in form.name.errors %}
                <div class="text-danger small">{{ error }}</div>
            {% endfor %}
        </div>
    </div>

    <!-- Active -->
    <div class="mb-3 row">
        <div class="col-sm-2"></div>
        <div class="col-sm-10">
            <div class="form-check">
                {{ form.active }}
                <label class="form-check-label" for="{{ form.active.id_for_label }}">Active</label>
            </div>
        </div>
    </div>

    <div class="mt-4 d-flex gap-2">
        <a href="{% url 'tag_list' %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-success">Save Tag</button>
    </div>
</form>

{% endblock %}
