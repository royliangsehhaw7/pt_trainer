{% extends 'trainer/base.html' %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
        <h2 class="mb-2 mb-sm-0">Tags</h2>
        <!-- You can put a back button if needed -->
        <a href="{% url 'tag_list' %}" class="btn btn-outline-secondary">Back</a>
    </div>

    <form method="POST" class="border rounded p-4 shadow-sm bg-body">
        {% csrf_token %}

        <!-- form.instance points to the 'tag' object you passed in the view -->
        <p>
            Confirm the deletion of TAG  <strong>{{ form.name }}</strong>
        </p>
        
        <!-- <p class="text-muted small">This action cannot be undone.</p> -->

        <div class="mt-4">
            <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
            <a href="{% url 'tag_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
{% endblock %}
