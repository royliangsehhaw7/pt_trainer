{% extends "trainer/base_public.html" %}

{% block content %}
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="card shadow border-0" style="width: 100%; max-width: 450px;">
            <div class="card-body p-4">
                <h3 class="text-center fw-bold mb-4">Login</h3>

                <!-- 1. CATCHES STANDARD LOGIN ERRORS (Username/Password) -->
                {% if form.errors %}
                    <div class="alert alert-danger py-2 small text-center">
                        Invalid username or password.
                    </div>
                {% endif %}

                <!-- STANDARD DJANGO LOGIN FORM -->
                <form method="post">
                    {% csrf_token %}
                    <div class="input-group mb-3">
                        <span class="input-group-text text-muted border-end-0">
                            <i class="bi bi-person-fill"></i>
                        </span>
                        <input type="text" name="username" placeholder="Email / Username" required
                            class="form-control border-start-0">
                    </div>

                    <div class="input-group mb-4">
                        <span class="input-group-text text-muted border-end-0">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input type="password" name="password" placeholder="Password" required
                            class="form-control border-start-0"/>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">
                        Login
                    </button>
                </form>

                <div class="text-center my-3 text-muted small">or</div>

                <!-- SOCIAL LOGIN BUTTON -->
                <div class="row p-3">
                    <div class="col-12 col-md-6 col-lg-6">
                        <a href="{% url 'social:begin' 'google-oauth2' %}" class="btn w-100">
                            <i class="bi bi-google me-2"></i> Google
                        </a>
                    </div>
                    <div class="col-12 col-md-6 col-lg-6">
                        <a href="{% url 'social:begin' 'github' %}" class="btn w-100">
                            <i class="bi bi-github me-2"></i> Github
                        </a>       
                    </div>                    
                </div>
                

                <div class="text-center mt-4">
                    <a href="{% url 'password_reset' %}" class="small text-decoration-none d-block mb-2 text-muted">
                        Forgot password?
                    </a>
                    <span class="small text-muted">New here? </span>
                    <a href="{% url 'register' %}" class="small text-decoration-none fw-bold">
                        Create an account
                    </a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
